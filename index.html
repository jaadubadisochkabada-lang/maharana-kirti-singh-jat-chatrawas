<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#176534">
  <meta name="description" content="महाराणा कीर्ति सिंह जाट छात्रावास, हुजरात पुल, लश्कर, ग्वालियर। शिक्षा, समाज सेवा और छात्र सहायता।">
  <title>महाराणा कीर्ति सिंह जाट छात्रावास</title>
  <style>
    :root {
      --green: #176534;
      --dark: #104523;
      --saffron: #c66a17;
      --cream: #fffaf0;
      --white: #ffffff;
      --text: #263238;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 75px; }
    body {
      margin: 0;
      font-family: Arial, "Noto Sans Devanagari", sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.75;
    }
    header {
      background: linear-gradient(135deg, var(--dark), var(--green));
      color: var(--white);
      text-align: center;
      padding: 27px 14px;
    }
    header h1 { font-size: clamp(23px, 5vw, 36px); margin: 0 0 6px; }
    header p { margin: 0; font-size: 17px; }
    nav {
      background: var(--saffron);
      padding: 10px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    nav a {
      color: var(--white);
      text-decoration: none;
      padding: 8px 11px;
      font-weight: bold;
      border-radius: 7px;
    }
    nav a:hover, nav a:focus { background: rgba(255,255,255,.2); }
    main { max-width: 1050px; margin: auto; padding: 22px 16px 40px; }
    .hero-photo { display: block; width: 100%; max-width: 760px; max-height: 360px; object-fit: cover; margin: 0 auto 22px; border-radius: 14px; border: 4px solid #ffffff; box-shadow: 0 4px 18px #00000018; }
    .hero {
      text-align: center;
      background: #f5ead5;
      padding: 32px 18px;
      border-radius: 18px;
      border: 1px solid #eadcc2;
    }
    .hero h2 {
      font-size: clamp(24px, 5vw, 34px);
      margin: 0 0 10px;
      color: var(--green);
    }
    .hero p { font-size: 18px; margin: 0 0 20px; }
    .btn {
      display: inline-block;
      background: var(--green);
      color: var(--white);
      padding: 11px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin: 4px;
      border: 0;
    }
    .btn:hover, .btn:focus { filter: brightness(.92); }
    .btn.orange { background: var(--saffron); }
    section { margin-top: 34px; }
    h2.section-title { color: var(--green); font-size: 26px; margin-bottom: 14px; }
    p { overflow-wrap: anywhere; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }
    .card {
      background: var(--white);
      border: 1px solid #e2dfd5;
      border-radius: 13px;
      padding: 18px;
      box-shadow: 0 3px 12px #00000008;
    }
    .card h3 { color: var(--green); margin-top: 0; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .gallery figure {
      margin: 0;
      background: var(--white);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e2dfd5;
    }
    .gallery img { display: block; width: 100%; height: 190px; object-fit: cover; }
    .gallery figcaption { padding: 8px 10px; font-size: 14px; }
    .notice {
      background: #fff0d8;
      border-left: 5px solid var(--saffron);
      padding: 14px;
      border-radius: 7px;
      margin-top: 18px;
    }
    ul { padding-left: 22px; }
    .member-role { color: #555; font-size: 14px; }
    .contact-box { text-align: center; background: #eaf4ec; padding: 22px; border-radius: 14px; }
    .small { font-size: 13px; color: #666; }
    footer { background: var(--dark); color: var(--white); text-align: center; padding: 23px 14px; }
    footer p { margin: 5px; }
    @media (min-width: 700px) {
      .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .gallery img { height: 220px; }
    }
    @media (max-width: 380px) {
      nav a { padding: 7px; font-size: 14px; }
      .gallery img { height: 145px; }
    }
  </style>
</head>
